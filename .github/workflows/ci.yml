name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout 5m

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ltp
          POSTGRES_PASSWORD: ltp
          POSTGRES_DB: ltp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ltp -d ltp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://ltp:ltp@localhost:5432/ltp?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          go build -o bin/loadtest-controller ./cmds/loadtest-controller
          if [ -d ./cmds/mock-service ]; then
            go build -o bin/mock-service ./cmds/mock-service
          fi

  # Plans/22 + plans/23: integration harness trên colima (cùng tooling chạy
  # local — docs/namespace-status-watcher.md §9). Ubuntu runner không có KVM
  # nên Lima chạy qemu (start ~3-6 phút, timeout generous). Fake-client
  # counterparts chạy trong job `test`.
  integration-colima:
    name: Integration Tests (colima k8s)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ltp
          POSTGRES_PASSWORD: ltp
          POSTGRES_DB: ltp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ltp -d ltp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://ltp:ltp@localhost:5432/ltp?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install colima + lima + kubectl (official binaries)
        run: |
          set -e
          sudo mkdir -p /usr/local/bin
          # lima (colima's VM backend) — release tarball
          LIMA_VER=$(curl -fsSL https://api.github.com/repos/lima-vm/lima/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/${LIMA_VER}/lima-${LIMA_VER#v}-Linux-x86_64.tar.gz" -o /tmp/lima.tgz
          sudo tar -C /usr/local -xzf /tmp/lima.tgz
          # colima — release binary
          curl -fsSL https://github.com/abiosoft/colima/releases/latest/download/colima-Linux-x86_64.tar.gz -o /tmp/colima.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/colima.tgz
          # kubectl
          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          colima version && limactl --version && kubectl version --client

      - name: Start colima with kubernetes
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: colima start --kubernetes --cpu 2 --memory 6

      - name: Verify cluster + export K8S_API_URL
        id: cluster
        run: |
          kubectl get nodes
          SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "API server: $SERVER"

      - name: Apply migrations
        run: |
          set -e
          for f in $(find sql -maxdepth 1 -name '[0-9]*_*.sql' | sort); do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run WATCH-01..06 integration harness
        env:
          K8S_API_URL: ${{ steps.cluster.outputs.server }}
        run: |
          go test -tags harness_k8s -v -timeout 20m \
            ./tests/harness/watcher/... ./tests/harness/k8s/...

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get ns,deploy,svc,pods -A || true
          colima kubernetes logs 2>/dev/null | tail -50 || true

  # Setup database schema: apply mọi migration vào Postgres sạch, tuần tự,
  # rồi verify các bảng cốt lõi tồn tại. Lấy phong cách từ
  # sources/opsense-rs/.github/workflows/ci.yml (service container + health
  # check + verify sau khi stack up).
  sql-migrations:
    name: Database Schema Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: ltp
      PGPASSWORD: ltp
      PGDATABASE: ltp
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ltp
          POSTGRES_PASSWORD: ltp
          POSTGRES_DB: ltp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ltp -d ltp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migrations in order
        run: |
          set -e
          files=$(find sql -maxdepth 1 -name '[0-9]*_*.sql' | sort)
          if [ -z "$files" ]; then
            echo "No migrations found — skipping."
            exit 0
          fi
          for f in $files; do
            echo "== applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "All migrations applied cleanly."

      - name: Verify schema
        run: |
          set -e
          echo "=== Applied migrations ==="
          psql -v ON_ERROR_STOP=1 -c "SELECT filename, applied_at FROM tbl_schema_migrations ORDER BY id;"
          echo "=== Tables ==="
          psql -v ON_ERROR_STOP=1 -c "\dt"
          # Các bảng bắt buộc phải có sau toàn bộ migrations (cập nhật dần theo sql/)
          REQUIRED_TABLES="tbl_tenants tbl_tenant_hosts tbl_tenant_auth_profiles tbl_users tbl_user_external_identities tbl_user_roles tbl_access_tokens tbl_audit_log tbl_namespaces tbl_services tbl_databases tbl_ingress tbl_dependencies tbl_network_policies"
          for t in $REQUIRED_TABLES; do
            psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM information_schema.tables WHERE table_name='$t'" | grep -q 1 \
              || (echo "FAIL: missing table $t" && exit 1)
          done
          echo "All required tables present."

      - name: Run SQL transition tests
        run: |
          set -e
          for t in tests/sql/*_test.sql; do
            [ -e "$t" ] || continue
            echo "== running $t"
            psql -v ON_ERROR_STOP=1 -f "$t"
          done
          echo "SQL transition tests passed."
