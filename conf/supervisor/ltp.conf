[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

; Control plane BFF — nginx upstream unix:/var/run/axum (conf/nginx/http.conf).
[program:controller]
command=/app/loadtest-controller
directory=/app
environment=ADDR="unix:/var/run/axum/controller.sock",SCRIPTS_DIR="/tmp/ltp-scripts",LOG_LEVEL="info"
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
priority=10

; Mock runtime — internal data-plane only (no public vhost), TCP 8090.
[program:mock-service]
command=/app/mock-service
directory=/app
environment=ADDR=":8090",LOG_LEVEL="info"
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
priority=20

[program:nginx]
command=/bin/bash /app/nginx.sh
directory=/app
autostart=true
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root
priority=30

[program:alloy]
command=/bin/bash /app/alloy.sh
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
