apiVersion: v1
kind: Service
metadata:
  name: serve
  namespace: ltp-system
  labels:
    app: serve
    loadtest.io/managed-by: loadtest-controller
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8090
      targetPort: 8090
      name: mock
  selector:
    app: serve
