# File SOPS-encrypted (secrets.enc.yaml) mount vào /app/secrets/ để
# scripts/release.sh giải mã tại boot (SOPS_AGE_KEY_CONTENT từ Secret sops-age-key).
# Nội dung là mã hoá age — không có plaintext, an toàn commit.
#
# Generate (máy vận hành, one-off):
#   sops -e deploy/k8s/base/serve/secrets.dev.yaml > deploy/k8s/base/serve/secrets.enc.yaml
#   sau đó copy nội dung secrets.enc.yaml vào data.secrets.dev.enc.yaml bên dưới.
# Real deploy: sinh age key riêng, cập nhật .sops.yaml public key, re-encrypt,
# thêm SOPS_AGE_KEY_CONTENT vào repo/cluster secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: serve-sops-secrets
  namespace: ltp-system
  labels:
    app: serve
    loadtest.io/managed-by: loadtest-controller
