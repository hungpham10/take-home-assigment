# Dex OIDC provider dev — config từ conf/dex/config.dev.yaml (pattern opsense-rs).
# issuer http://localhost:5556/dex khớp với seed tenant auth profile trong
# tests/integration/seed.go (issuer/jwks in-network).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: ltp-system
  labels:
    app: dex
    loadtest.io/managed-by: loadtest-controller
data:
  config.yaml: |
    issuer: http://localhost:5556/dex

    storage:
      type: memory

    web:
      http: 0.0.0.0:5556

    staticClients:
      - id: ltp-test
        name: Loadtest Platform Test Client
        secret: ltp-dev-shared-secret-32-bytes-min!!
        redirectURIs:
          - http://localhost:8080/callback
          - http://127.0.0.1:8080/callback
        grantTypes: [authorization_code, refresh_token]
        responseTypes: [code]
        scopeMappings:
          - scopes: [openid, email, profile]
            identityProvider: static

    enablePasswordDB: true
    staticPasswords:
      - email: dev-user@example.com
        hash: $2b$10$XyvfzkvT3YcLHB6DWle.3egKeghQ4bLGvR3XchL5OusGICmefH/Ba   # bcrypt("password")
        username: dev-user
        # UUID cố định = tbl_users.id được seed trong tests/e2e-full-deploy.sh.
        # Bắt buộc: id_token.sub = userID này, và nginx set nó thành X-User-Id;
        # tbl_namespaces.owner_user_id là UUID REFERENCES tbl_users(id).
        userID: 11111111-1111-4111-8111-111111111111

    staticIdentityProviders:
      - id: static
        name: Static
        type: static
